apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-postgres-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: python-postgres
  template:
    metadata:
      labels:
        app: python-postgres
    spec:
      containers:
        - name: app
          image: abhijeetpratap/python-postgres-compose-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: postgres-service
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
