apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-postgres-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: python-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: python-postgres-app
                port:
                  number: 5000
