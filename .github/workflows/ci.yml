name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: python-postgres-compose-app
  AWS_ACCOUNT_ID: "111789566208"
  KUBECONFIG: C:\actions-runner\kubeconfig

jobs:

  # ---------------------------------------------------------
  # 1. TEST + LINT
  # Runs for pull requests and pushes to main
  # ---------------------------------------------------------
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run linter
        run: ruff check .


  # ---------------------------------------------------------
  # 2. BUILD + PUSH TO ECR
  # Runs only after test-and-lint succeeds on main
  # ---------------------------------------------------------
  build-and-push:
    needs: test-and-lint

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.image-info.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Export image name
        id: image-info
        shell: bash
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"


  # ---------------------------------------------------------
  # 3. DEPLOY TO LOCAL MINIKUBE
  # Runs on YOUR Windows self-hosted runner
  # ---------------------------------------------------------
  deploy-minikube:
    needs: build-and-push

    runs-on:
      - self-hosted
      - Windows
      - X64

    permissions:
      contents: read
      id-token: write

    env:
      ECR_REGISTRY: 111789566208.dkr.ecr.ap-south-1.amazonaws.com
      ECR_IMAGE: ${{ needs.build-and-push.outputs.image }}
      K8S_POSTGRES_PASSWORD: ${{ secrets.K8S_POSTGRES_PASSWORD }}

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -----------------------------------------------------
      # AWS authentication using GitHub OIDC
      # -----------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: MinikubeDeploy-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}


      # -----------------------------------------------------
      # Verify Kubernetes access
      # Use absolute kubectl path because the runner
      # service does not use the normal user's PATH
      # -----------------------------------------------------
      - name: Verify Kubernetes access
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" --kubeconfig "C:\actions-runner\kubeconfig" config current-context
          & "C:\actions-runner\kubectl.exe" --kubeconfig "C:\actions-runner\kubeconfig" get nodes


      # -----------------------------------------------------
      # Verify Minikube
      # -----------------------------------------------------
      - name: Verify Minikube
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" --kubeconfig "C:\actions-runner\kubeconfig" get nodes -o wide


      # -----------------------------------------------------
      # Create/update PostgreSQL Kubernetes secret
      # Password comes from GitHub Secret
      # -----------------------------------------------------
      - name: Create PostgreSQL Kubernetes secret
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:K8S_POSTGRES_PASSWORD)) {
            throw "K8S_POSTGRES_PASSWORD GitHub Secret is missing."
          }

          $secretYaml = & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            create secret generic postgres-secret `
            --from-literal="POSTGRES_PASSWORD=$env:K8S_POSTGRES_PASSWORD" `
            --dry-run=client `
            -o yaml

          $secretYaml | & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            apply -f -


      # -----------------------------------------------------
      # Create/update ECR image pull secret
      # -----------------------------------------------------
      - name: Create ECR image pull secret
        shell: powershell
        run: |
          $ecrPassword = & "C:\Program Files\Amazon\AWSCLIV2\aws.exe" `
            ecr get-login-password `
            --region $env:AWS_REGION

          if ([string]::IsNullOrWhiteSpace($ecrPassword)) {
            throw "Failed to obtain ECR login password."
          }

          $secretYaml = & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            create secret docker-registry ecr-registry-secret `
            --docker-server=$env:ECR_REGISTRY `
            --docker-username=AWS `
            --docker-password=$ecrPassword `
            --dry-run=client `
            -o yaml

          $secretYaml | & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            apply -f -


      # -----------------------------------------------------
      # Apply Kubernetes ConfigMap
      # -----------------------------------------------------
      - name: Apply Kubernetes ConfigMap
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            apply -f k8s/configmap.yaml


      # -----------------------------------------------------
      # Apply PostgreSQL Service
      # -----------------------------------------------------
      - name: Apply PostgreSQL Service
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            apply -f k8s/postgres-service.yaml


      # -----------------------------------------------------
      # Apply PostgreSQL Deployment
      # -----------------------------------------------------
      - name: Apply PostgreSQL Deployment
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            apply -f k8s/postgres-deployment.yaml


      # -----------------------------------------------------
      # Apply Application Service
      # -----------------------------------------------------
      - name: Apply Application Service
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            apply -f k8s/app-service.yaml


      # -----------------------------------------------------
      # Apply Application Deployment
      # imagePullSecrets is already declared in
      # k8s/app-deployment.yaml
      # -----------------------------------------------------
      - name: Apply Application Deployment
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            apply -f k8s/app-deployment.yaml


      # -----------------------------------------------------
      # Apply Ingress
      # -----------------------------------------------------
      - name: Apply Ingress
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            apply -f k8s/ingress.yaml


      # -----------------------------------------------------
      # Deploy the exact ECR image produced by this commit
      # -----------------------------------------------------
      - name: Deploy exact ECR image
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            set image deployment/python-postgres-app `
            app=$env:ECR_IMAGE


      # -----------------------------------------------------
      # Wait for PostgreSQL rollout
      # -----------------------------------------------------
      - name: Wait for PostgreSQL rollout
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            rollout status deployment/postgres-db `
            --timeout=180s


      # -----------------------------------------------------
      # Wait for application rollout
      # -----------------------------------------------------
      - name: Wait for application rollout
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            rollout status deployment/python-postgres-app `
            --timeout=180s


      # -----------------------------------------------------
      # Final deployment verification
      # -----------------------------------------------------
      - name: Verify deployment
        shell: powershell
        run: |
          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            get deployments

          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            get pods -o wide

          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            get services

          & "C:\actions-runner\kubectl.exe" `
            --kubeconfig "C:\actions-runner\kubeconfig" `
            get ingress